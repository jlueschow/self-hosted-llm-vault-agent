name: Release

# Erstellt bei jedem Versions-Tag (z. B. "0.2.0", ohne "v"-Präfix — Obsidian-
# Konvention) automatisch einen GitHub-Release mit den gebauten Artefakten.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - run: npm ci
      - run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            dist/main.js manifest.json styles.css \
            --title "$tag" \
            --generate-notes
